participants:
  - id: user
    label: User
    kind: actor
  - id: web
    label: Web app
  - id: api
    label: API
  - id: db
    label: Database
sequence:
  - from: user
    to: web
    text: Submit credentials
  - from: web
    to: api
    text: POST /login
    type: async
  - activate: api
  - frame: alt
    text: valid credentials
  - self: api
    text: Hash password
  - from: api
    to: db
    text: Find user
  - from: db
    to: api
    text: User row
    type: return
  - else: invalid credentials
  - from: api
    to: web
    text: 401
    type: return
  - end: alt
  - frame: loop
    text: retry
  - from: web
    to: api
    text: Check status
  - end: loop
  - deactivate: api
  - from: api
    to: web
    text: Token
    type: return
